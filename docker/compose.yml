services:
  serpscrap-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serpscrap}
      POSTGRES_USER: ${POSTGRES_USER:-serpscrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [serpscrap]

  serpscrap-app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    entrypoint: ["python"]
    command: ["-m", "serpscrap.api_server"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-serpscrap}:${POSTGRES_PASSWORD:-change-me}@serpscrap-db:5432/${POSTGRES_DB:-serpscrap}
      SERPSCRAP_DATA_DIR: /var/lib/serpscrap
      SERPSCRAP_CACHE_DIR: /var/lib/serpscrap/cache
      SERPSCRAP_DIAGNOSTICS_DIR: /var/lib/serpscrap/diagnostics
    volumes:
      - ../data/cache:/var/lib/serpscrap/cache
      - ../data/diagnostics:/var/lib/serpscrap/diagnostics
      - ../data/exports:/var/lib/serpscrap/exports
      - ../logs:/var/log/serpscrap
    depends_on:
      serpscrap-db:
        condition: service_healthy
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [serpscrap]

  serpscrap-ui:
    build:
      context: ..
      dockerfile: docker/ui/Dockerfile
    restart: unless-stopped
    depends_on: [serpscrap-app]
    ports: ["8080:8080"]
    networks: [serpscrap]

  serpscrap-mcp:
    build:
      context: ..
      dockerfile: docker/mcp/Dockerfile
    restart: unless-stopped
    environment:
      SERPSCRAP_API_URL: http://serpscrap-app:8000/api/v1
    depends_on: [serpscrap-app]
    ports: ["8001:8001"]
    networks: [serpscrap]

networks:
  serpscrap:
    driver: bridge
