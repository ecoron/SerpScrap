[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "SerpScrap"
version = "2.0.0-alpha.1"
description = "Structured SERP retrieval with Selenium and headless Chrome"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ronald Schmidt", email = "ecoron@zu-web.de" }]
keywords = ["seo", "serp", "scraping", "selenium", "chrome"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet",
]
dependencies = [
  "PySocks>=1.7.1,<2",
  "beautifulsoup4>=4.13,<5",
  "bleach>=6.2,<7",
  "chardet>=5.2,<6",
  "click>=8.4.2,<9",
  "Flask>=3.1.2,<4",
  "cssselect>=1.3,<2",
  "html2text>=2025.4.15,<2027",
  "lxml>=6.1.1,<7",
  "selenium>=4.33,<5",
  "SQLAlchemy>=2.0.51,<2.1",
  "psycopg[binary]>=3.2,<4",
  "urllib3>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
serpscrap = "serpscrap.cli:main"

[project.urls]
Homepage = "https://github.com/ecoron/SerpScrap"
Documentation = "https://serpscrap.readthedocs.io/"

[tool.setuptools.packages.find]
include = ["serpscrap*", "scrapcore*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "browser: requires local Chrome and network access",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
