{% extends "base.html" %}
{% block title %}Configuration · SerpScrap{% endblock %}
{% block content %}
<section class="view-stack configuration-page">
  <div class="page-heading">
    <div><p class="eyebrow">Workspace settings</p><h2>Configuration</h2><p>Configure defaults for future searches. Existing runs remain unchanged.</p></div>
    <div id="config-source" class="configuration-source" aria-live="polite">Loading configuration…</div>
  </div>
  <form id="config-form" novalidate>
    <div id="config-error-summary" class="notice error" role="alert" hidden></div>
    <div id="configuration-groups" class="configuration-groups" aria-live="polite"><div class="panel"><div class="skeleton-line"></div><div class="skeleton-line"></div></div></div>
    <div class="configuration-actions sticky-toolbar">
      <div><strong id="config-dirty-label">No unsaved changes</strong><small id="config-scope-label">Applies to new searches.</small></div>
      <div class="button-row"><button class="button button-primary" id="save-config" type="submit">Save changes</button><button class="button button-ghost" id="reset-changes" type="button">Reset changes</button><button class="button button-danger" id="reset-config" type="button">Reset to initial defaults</button></div>
    </div>
  </form>
</section>
{% endblock %}
