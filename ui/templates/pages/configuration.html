{% extends "base.html" %}
{% block title %}Configuration · SerpScrap{% endblock %}
{% block content %}
<section class="view-stack"><div class="page-heading"><div><p class="eyebrow">Workspace settings</p><h2>Configuration</h2><p>Choose defaults for future searches. Existing runs remain unchanged.</p></div></div><section class="panel narrow-panel"><form id="config-form"><fieldset><legend>Default engines</legend><div id="config-engines" class="engine-grid"></div></fieldset><div class="form-row"><label class="field">Country<input id="config-country" maxlength="2"></label><label class="field">Search type<select id="config-search-type"><option value="normal">Web</option><option value="image">Images</option><option value="news">News</option><option value="shopping">Shopping</option><option value="videos">Videos</option></select></label><label class="field">Pages<input id="config-pages" type="number" min="1" max="10"></label></div><div class="button-row"><button class="button button-primary" type="submit">Save configuration</button><button class="button button-ghost" id="reset-config" type="button">Reset defaults</button></div></form></section></section>
{% endblock %}
